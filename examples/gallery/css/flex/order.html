<!doctype html>
<meta charset="utf-8">
<title>flex: order re-arranges without moving the markup</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
.f { display:flex; width:300px; }
.f > div { width:100px; height:30px; }
</style>
<div class="f"><div class="box" style="order:2"></div><div class="alt" style="order:1"></div></div>
