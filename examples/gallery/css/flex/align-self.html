<!doctype html>
<meta charset="utf-8">
<title>flex: align-self overrides align-items</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
.f { display:flex; align-items:flex-start; height:100px; width:300px; }
.f > div { width:60px; height:20px; }
</style>
<div class="f"><div class="box"></div><div class="alt" style="align-self:flex-end"></div></div>
