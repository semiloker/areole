<!doctype html>
<meta charset="utf-8">
<title>flex: wrapping</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
.f { display:flex; flex-wrap:wrap; width:300px; gap:10px; }
.f > div { width:130px; height:30px; }
</style>
<div class="f"><div class="box"></div><div class="alt"></div><div class="box"></div><div class="alt"></div></div>
