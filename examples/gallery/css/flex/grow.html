<title>flex: flex-grow shares what is left</title>

  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }

</style>
<style>
.f { display:flex; width:400px; }
.f > div { height:40px; }
