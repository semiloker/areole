<!doctype html>
<meta charset="utf-8">
<title>display: contents makes a wrapper vanish</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
.g { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:300px; }
.g div div { height:30px; }
</style>
<div class="g"><div style="display:contents"><div class="box"></div><div class="alt"></div></div></div>
