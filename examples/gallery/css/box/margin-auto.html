<!doctype html>
<meta charset="utf-8">
<title>box: margin auto centres</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<div style="width:400px"><div class="box" style="width:120px;height:20px;margin:0 auto"></div><div class="alt" style="width:120px;height:20px;margin-left:auto;margin-right:0"></div></div>
