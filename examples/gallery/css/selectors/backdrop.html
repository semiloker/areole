<!doctype html>
<meta charset="utf-8">
<title>selectors: ::backdrop styles no box</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
::backdrop { background:#ff0000; }
/* Nothing here is modal, so the backdrop is not painted and the
   rule reaches no box at all -- which is the thing to check. */
</style>
<div class="box" style="width:200px;height:20px"></div>
