<!doctype html>
<meta charset="utf-8">
<title>selectors: :not() with a list</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
div { width:100px; height:20px; background:#cfe3f5; }
div:not(.a, .b) { width:300px; background:#f5d9cf; }
</style>
<div class="a"></div><div class="b"></div><div class="c"></div>
