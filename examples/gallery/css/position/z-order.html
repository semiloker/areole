<!doctype html>
<meta charset="utf-8">
<title>position: later boxes paint over earlier ones</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<div style="position:relative;width:300px;height:100px;background:#eee"><div class="box" style="position:absolute;left:20px;top:20px;width:120px;height:50px"></div><div class="alt" style="position:absolute;left:80px;top:40px;width:120px;height:50px"></div></div>
