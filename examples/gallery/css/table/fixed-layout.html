<!doctype html>
<meta charset="utf-8">
<title>table: table-layout fixed</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
table { table-layout:fixed; width:300px; border-collapse:collapse; }
td { height:30px; padding:0; }
.a { background:#cfe3f5; width:100px; } .b { background:#f5d9cf; }
</style>
<table><tr><td class="a"></td><td class="b"></td></tr></table>
