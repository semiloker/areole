<!doctype html>
<meta charset="utf-8">
<title>table: rowspan</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
table { border-collapse:collapse; }
td { width:80px; height:30px; padding:0; }
.a { background:#cfe3f5; } .b { background:#f5d9cf; }
</style>
<table><tr><td rowspan="2" class="a"></td><td class="b"></td></tr><tr><td class="b"></td></tr></table>
