<!doctype html>
<meta charset="utf-8">
<title>text: alignment</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<div class="box" style="width:300px;text-align:left">left</div>
<div class="alt" style="width:300px;text-align:center">center</div>
<div class="box" style="width:300px;text-align:right">right</div>
