<title>overflow: a clipped box still lays out its children</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<div style="width:200px;height:60px;overflow:hidden;background:#eee"><div class="box" style="height:30px"></div><div class="alt" style="height:30px"></div><div class="box" style="height:30px"></div></div>
