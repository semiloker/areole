<!doctype html>
<meta charset="utf-8">
<title>grid: placement by line number</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
.g { display:grid; grid-template-columns:repeat(3, 100px); width:400px; }
.g > div { height:30px; }
</style>
<div class="g"><div class="box" style="grid-column:2 / 4"></div></div>
