<!doctype html>
<meta charset="utf-8">
<title>grid: a cell that spans two columns</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
.g { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:400px; }
.g > div { height:30px; }
</style>
<div class="g"><div class="box" style="grid-column:span 2"></div><div class="alt"></div><div class="alt"></div></div>
