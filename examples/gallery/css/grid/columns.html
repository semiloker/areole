<!doctype html>
<meta charset="utf-8">
<title>grid: three fixed columns</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
.g { display:grid; grid-template-columns:100px 120px 80px; width:400px; }
.g > div { height:40px; }
</style>
<div class="g"><div class="box"></div><div class="alt"></div><div class="box"></div></div>
