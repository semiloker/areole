<!doctype html>
<meta charset="utf-8">
<title>parsing: this page has a doctype, so no quirks</title>
<style>
  html { font: 16px/1.4 sans-serif; }
  body { margin: 0; padding: 16px; background: #fff; }
  .box { background: #cfe3f5; }
  .alt { background: #f5d9cf; }
</style>
<style>
/* `width: 200` with no unit is invalid in standards mode and is
   dropped, so the box keeps the width its style attribute gave it. */
.box { width:200; }
</style>
<div class="box" style="width:100px;height:20px"></div>
