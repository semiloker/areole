<!DOCTYPE html>
<meta charset="utf-8">
<title>areole safe-area corpus — the browser twin</title>

<!--
  The same env() cases as examples/07_env/main.c, in HTML:

      python tools/compare_layout.py --run ./build/example_env.exe \
             examples/07_env/env.html

  ----------------------------------------------------------------------------
  The substitution, which is the whole point

  A browser cannot be handed safe-area insets here. There is no CSS that sets
  env(), and --dump-dom has no device to emulate one from. So areole is given
  the insets by its stub backend and writes env(), and this file writes the
  same numbers as literal lengths.

  That is what "a simulated safe area" has to mean, and it still tests the part
  that could be wrong: env() resolution, the known-versus-silent distinction and
  the fallback all sit between the backend and the layout, and this says the
  layout on the far side of them is a browser's.

  Each literal below is annotated with the env() it stands in for, so the two
  files can be read against each other.

      safe-area insets   top 34, right 8, bottom 12, left 6
      titlebar           96 x 32

  ----------------------------------------------------------------------------
  What is deliberately not here

  `viewport-fit: auto`. That half shrinks the layout viewport, which moves
  areole's root box to the corner of the safe rectangle rather than the
  surface's. The harness reads browser rectangles relative to the case element,
  so saying that here would need a wrapper the areole tree does not have, and
  the two would stop matching on their paths for a reason with nothing to do
  with safe areas. It is pinned in ar_test.c instead.
-->

<style>
* { margin: 0; padding: 0; }

body {
  background: #fff;
  font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
  padding: 20px;
}

h2 {
  font: 600 12px/1.4 "Segoe UI", system-ui, sans-serif;
  color: #8d8578;
  margin: 14px 0 4px;
}

.app { display: flow-root; width: 200px; height: 200px; background: #fff; }
.bar { display: block; background: #cfd8e3; }

/* env(safe-area-inset-top) */
.v-cover-top .bar { padding-top: 34px; }

/* env(safe-area-inset-top / -right / -bottom / -left) */
.v-cover-four .bar {
  padding-top: 34px;
  padding-right: 8px;
  padding-bottom: 12px;
  padding-left: 6px;
}

/* env(safe-area-inset-top, 20px) with the backend silent: the fallback. */
.v-fallback .bar { padding-top: 20px; }

/* env(safe-area-inset-top, 20px) with the backend reporting zero: not the
   fallback, because a reported zero is an answer. */
.v-reported-zero .bar { padding-top: 0px; }

/* env(titlebar-area-width, 5px) */
.v-titlebar .bar { padding-left: 96px; }

/* env(nonsense-inset, 14px) — an unknown name takes its fallback. */
.v-unknown-with-fallback .bar { padding-top: 14px; }

/* env(nonsense-inset) — no value at all, so the declaration goes and the
   property keeps what it would have had. */
.v-unknown-bare .bar { padding-top: 0px; }

#cases { display: flex; flex-wrap: wrap; gap: 8px 18px; }
textarea#out { display: block; width: 100%; height: 200px; margin-top: 20px;
               font: 12px/1.35 Consolas, monospace; }
</style>

<h1 style="font-size:15px;margin-bottom:8px">areole safe-area corpus — the browser twin</h1>

<div id="cases"></div>
<textarea id="out" readonly></textarea>

<script>
/* Mirrors VARIANTS[] and HEIGHTS[] in examples/07_env/main.c. */
const VARIANTS = [
  'cover-top', 'cover-four', 'fallback', 'reported-zero',
  'titlebar', 'unknown-with-fallback', 'unknown-bare'
];
const HEIGHTS = [20, 60];

function buildCases() {
  const host = document.getElementById('cases');

  for (const v of VARIANTS) {
    for (const h of HEIGHTS) {
      const name = v + '-h' + h;

      const title = document.createElement('h2');
      title.textContent = name;

      const app = document.createElement('div');
      app.className = 'app v-' + v;
      app.dataset.page = name;

      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = h + 'px';
      app.appendChild(bar);

      const cell = document.createElement('div');
      cell.appendChild(title);
      cell.appendChild(app);
      host.appendChild(cell);
    }
  }
}

/*
 * The same walk and the same output format as the other twins: document order
 * is declaration order, coordinates are relative to the .app origin, and
 * everything is rounded because areole's layout is integer end to end.
 */
function childIndex(el) {
  let n = 0;
  for (let p = el.previousElementSibling; p; p = p.previousElementSibling) n++;
  return n;
}

function walk(el, path, origin, out) {
  const r = el.getBoundingClientRect();
  out.push(
    path + ' ' +
    Math.round(r.left - origin.left) + ' ' +
    Math.round(r.top - origin.top) + ' ' +
    Math.round(r.width) + ' ' +
    Math.round(r.height) + ' |'
  );
  for (const c of el.children) walk(c, path + '/' + childIndex(c), origin, out);
}

function dump() {
  const out = ['# browser ' + navigator.userAgent.replace(/\s+/g, ' ')];
  for (const app of document.querySelectorAll('.app')) {
    out.push('# page ' + app.dataset.page);
    walk(app, '0', app.getBoundingClientRect(), out);
  }
  const box = document.getElementById('out');
  box.value = out.join('\n');
  box.textContent = out.join('\n');   /* so --dump-dom sees it */
}

buildCases();

/*
 * Dumped straight away rather than after an animation frame, which the snap
 * and sticky twins both need.
 *
 * They set scrollTop, which invalidates and schedules a paint, so a
 * requestAnimationFrame callback is guaranteed to run. Nothing on this page
 * changes after it is built, so headless produces no further frame and that
 * callback never fires -- the dump silently stayed empty and every page went
 * missing from the comparison. There is nothing asynchronous to wait for here:
 * the layout is final the moment the elements exist.
 */
dump();
</script>
