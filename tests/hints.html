  ['vspace-img', '', '\u003cimg id="x" vspace="6">', 'margin-top'],
  ['align-left', '', '\u003cp id="x" align="left">t\u003c/p>', 'text-align'],
  ['align-right', '', '\u003cp id="x" align="right">t\u003c/p>', 'text-align'],
  ['align-center', '', '\u003cp id="x" align="center">t\u003c/p>', 'text-align'],
  ['align-middle-is-center', '', '\u003cp id="x" align="middle">t\u003c/p>', 'text-align'],

  ['length-trailing-junk', '', '\u003cimg id="x" width="200abc">', 'width'],
  ['length-empty', '', '\u003cimg id="x" width="" height="55">', 'height'],
];

const host = document.getElementById('cases');
const out = [];
for (const [name, css, html, props] of CASES) {
  const box = document.createElement('div');
  box.className = 'case';
  box.dataset.page = name;
  if (css) {
    /* Scoped, so every case's stylesheet can share one page. */
    const st = document.createElement('style');
    st.textContent = css.replace(/(^|\})\s*([^{}]+)\{/g,
      (m, brace, sel) => brace + sel.split(',')
        .map(s => '[data-page="' + name + '"] ' + s.trim()).join(',') + '{');
    box.appendChild(st);
  }
  box.insertAdjacentHTML('beforeend', html);
  host.appendChild(box);
}

for (const [name, css, html, props] of CASES) {
  const box = host.querySelector('[data-page="' + name + '"]');
  const el = box.querySelector('#x');
  out.push('# case ' + name);
  for (const prop of props.split(/\s+/).filter(Boolean)) {
    out.push(prop + ' ' +
      (el ? getComputedStyle(el).getPropertyValue(prop) : '?'));
  }
}

const t = document.getElementById('out');
t.value = out.join('\n');
t.textContent = out.join('\n');
</script>
