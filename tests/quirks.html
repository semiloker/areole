<meta charset="utf-8">
<title>areole quirks mode — the browser twin</title>

<!--
  GENERATED by ar_quirks --html. Do not edit; CI diffs it.

      python tools/compare_computed.py --run ./build/ar_quirks.exe \
             tests/quirks.html

  Each case is a container the size of areole's body, holding the same
  fragment, with the same author stylesheet scoped to it. The reported
  values are getComputedStyle of the element marked id=x.

  NO DOCTYPE, on purpose: that is what puts this page in quirks mode,
  which is the whole of what it is testing. document.compatMode has to
  say BackCompat or every case here is measuring the wrong thing, so
  the dump says which mode it was read in.
-->

<style>
  body { margin:0; }
  .case { width:420px; margin:0; padding:0; }
  textarea#out { display:block; width:100%; height:240px; }
</style>

<div id="cases"></div>
<textarea id="out" readonly></textarea>

<script>
const CASES = [
  ['width-unitless', '#x { width:100; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['height-unitless', '#x { height:40; }', '\u003cdiv id="x">t\u003c/div>', 'height'],
  ['padding-unitless', '#x { padding:7; }', '\u003cdiv id="x">t\u003c/div>', 'padding-left'],
  ['margin-unitless', '#x { margin:9; }', '\u003cdiv id="x">t\u003c/div>', 'margin-top'],
  ['font-size-unitless', '#x { font-size:22; }', '\u003cdiv id="x">t\u003c/div>', 'font-size'],
  ['border-spacing-unitless', '#x { border-spacing:6; }', '\u003ctable id="x">\u003ctr>\u003ctd>t\u003c/td>\u003c/tr>\u003c/table>', 'border-spacing'],
  ['zero-needs-no-unit', '#x { margin:0; padding:0; }', '\u003cdiv id="x">t\u003c/div>', 'margin-top padding-left'],
  ['units-still-work', '#x { width:80px; margin:5px; }', '\u003cdiv id="x">t\u003c/div>', 'width margin-top'],
  ['percent-still-works', '#x { width:50%; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['one-bad-value-costs-one-declaration', '#x { width:100; height:33px; }', '\u003cdiv id="x">t\u003c/div>', 'height'],
  ['table-does-not-inherit-font', '#w { font-size:30px; }', '\u003cdiv id="w">\u003ctable>\u003ctr>\u003ctd id="x">t\u003c/td>\u003c/tr>\u003c/table>\u003c/div>', 'font-size'],
  ['table-itself-does-not-inherit', '#w { font-size:30px; }', '\u003cdiv id="w">\u003ctable id="x">\u003ctr>\u003ctd>t\u003c/td>\u003c/tr>\u003c/table>\u003c/div>', 'font-size'],
  ['a-table-can-still-be-told', '#w { font-size:30px; } table { font-size:24px; }', '\u003cdiv id="w">\u003ctable>\u003ctr>\u003ctd id="x">t\u003c/td>\u003c/tr>\u003c/table>\u003c/div>', 'font-size'],
  ['a-cell-can-still-be-told', '#w { font-size:30px; } td { font-size:11px; }', '\u003cdiv id="w">\u003ctable>\u003ctr>\u003ctd id="x">t\u003c/td>\u003c/tr>\u003c/table>\u003c/div>', 'font-size'],
  ['not-a-table-still-inherits', '#w { font-size:30px; }', '\u003cdiv id="w">\u003cp id="x">t\u003c/p>\u003c/div>', 'font-size'],
  ['the-box-model-is-the-same', '#x { width:100px; padding:10px; }', '\u003cdiv id="x">t\u003c/div>', 'width padding-left'],
  ['a-percentage-height-is-the-same', '#w { height:200px; } #x { height:50%; }', '\u003cdiv id="w">\u003cdiv id="x">t\u003c/div>\u003c/div>', 'height'],
  ['the-root-is-still-sixteen', '', '\u003cp id="x">t\u003c/p>', 'font-size'],
  ['headings-are-still-headings', '', '\u003ch1 id="x">t\u003c/h1>', 'font-size font-weight'],
  ['blocks-are-still-blocks', '', '\u003cp id="x">t\u003c/p>', 'display margin-top'],
  ['lists-are-still-indented', '', '\u003cul id="x">\u003cli>t\u003c/li>\u003c/ul>', 'padding-left margin-top'],
  ['tables-are-still-tables', '', '\u003ctable id="x">\u003ctr>\u003ctd>t\u003c/td>\u003c/tr>\u003c/table>', 'display border-spacing'],
  ['cells-are-still-cells', '', '\u003ctable>\u003ctr>\u003ctd id="x">t\u003c/td>\u003c/tr>\u003c/table>', 'display padding-left'],
  ['italics-are-still-italic', '', '\u003cem id="x">t\u003c/em>', 'font-style display'],
  ['a-hint-still-maps', '', '\u003ctable>\u003ctr>\u003ctd id="x" bgcolor="red">t\u003c/td>\u003c/tr>\u003c/table>', 'background-color'],
  ['a-hint-still-loses-to-the-author', 'td { background:#0000ff; }', '\u003ctable>\u003ctr>\u003ctd id="x" bgcolor="red">t\u003c/td>\u003c/tr>\u003c/table>', 'background-color'],
  ['a-style-attribute-still-wins', '#x { width:20px; }', '\u003cdiv id="x" style="width:60px">t\u003c/div>', 'width'],
  ['important-still-beats-it', '#x { width:20px !important; }', '\u003cdiv id="x" style="width:60px">t\u003c/div>', 'width'],
  ['a-style-attribute-may-also-be-unitless', '', '\u003cdiv id="x" style="width:70">t\u003c/div>', 'width'],
  ['specificity-still-decides', 'div { width:10px; } #x { width:30px; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
];

const host = document.getElementById('cases');
const out = [];
for (const [name, css, html, props] of CASES) {
  const box = document.createElement('div');
  box.className = 'case';
  box.dataset.page = name;
  if (css) {
    /* Scoped, so every case's stylesheet can share one page. */
    const st = document.createElement('style');
    st.textContent = css.replace(/(^|\})\s*([^{}]+)\{/g,
      (m, brace, sel) => brace + sel.split(',')
        .map(s => '[data-page="' + name + '"] ' + s.trim()).join(',') + '{');
    box.appendChild(st);
  }
  box.insertAdjacentHTML('beforeend', html);
  host.appendChild(box);
}

for (const [name, css, html, props] of CASES) {
  const box = host.querySelector('[data-page="' + name + '"]');
  const el = box.querySelector('#x');
  out.push('# case ' + name);
  for (const prop of props.split(/\s+/).filter(Boolean)) {
    out.push(prop + ' ' +
      (el ? getComputedStyle(el).getPropertyValue(prop) : '?'));
  }
}

out.unshift('# mode ' + document.compatMode);
const t = document.getElementById('out');
t.value = out.join('\n');
t.textContent = out.join('\n');
</script>
