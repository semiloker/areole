<!DOCTYPE html>
<meta charset="utf-8">
<title>areole units — the browser twin</title>

<!--
  GENERATED by ar_units --html. Do not edit; CI diffs it.

      python tools/compare_computed.py --run ./build/ar_units.exe \
             tests/units.html

  Each case is a container the size of areole's body, holding the same
  fragment, with the same author stylesheet scoped to it. The reported
  values are getComputedStyle of the element marked id=x.
-->

<style>
  body { margin:0; }
  .case { width:420px; margin:0; padding:0; }
  textarea#out { display:block; width:100%; height:240px; }
</style>

<div id="cases"></div>
<textarea id="out" readonly></textarea>

<script>
const CASES = [
  ['px', '#x { width:40px; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['inch', '#x { width:2in; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['pica', '#x { width:3pc; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['point', '#x { width:12pt; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['point-again', '#x { width:72pt; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['centimetre', '#x { width:1cm; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['millimetre', '#x { width:10mm; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['quarter-mm', '#x { width:40q; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['centimetre-round', '#x { width:2cm; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['upper-case-px', '#x { width:40PX; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['mixed-case-pt', '#x { width:12Pt; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['em-at-root', '#x { width:2em; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['em-with-own-size', '#x { font-size:20px; width:3em; }', '\u003cdiv id="x">t\u003c/div>', 'width font-size'],
  ['em-on-font-size-then-padding', '#w { font-size:16px; } #x { font-size:2em; padding:1em; }', '\u003cdiv id="w">\u003cdiv id="x">t\u003c/div>\u003c/div>', 'font-size padding-left'],
  ['em-inherited-font', '#w { font-size:24px; } #x { width:2em; }', '\u003cdiv id="w">\u003cdiv id="x">t\u003c/div>\u003c/div>', 'width'],
  ['em-compounds-once-per-level', '#w { font-size:10px; } #m { font-size:2em; } #x { font-size:2em; }', '\u003cdiv id="w">\u003cdiv id="m">\u003cdiv id="x">t\u003c/div>\u003c/div>\u003c/div>', 'font-size'],
  ['em-margin', '#x { font-size:16px; margin:2em; }', '\u003cdiv id="x">t\u003c/div>', 'margin-top'],
  ['rem-at-root', '#x { width:2rem; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['rem-ignores-the-parent', '#w { font-size:40px; } #x { width:2rem; }', '\u003cdiv id="w">\u003cdiv id="x">t\u003c/div>\u003c/div>', 'width'],
  ['rem-beside-em', '#w { font-size:32px; } #x { width:1rem; height:1em; }', '\u003cdiv id="w">\u003cdiv id="x">t\u003c/div>\u003c/div>', 'width height'],
  ['ch-fallback', '#x { font-size:20px; width:4ch; }', '\u003cdiv id="x">t\u003c/div>', 'width'],
  ['lh-is-the-line-box', '#x { font-size:20px; line-height:30px; height:2lh; }', '\u003cdiv id="x">t\u003c/div>', 'height'],
  ['zero-is-zero', '#x { margin:0; padding:0; }', '\u003cdiv id="x">t\u003c/div>', 'margin-top padding-left'],
  ['zero-em', '#x { margin:0em; }', '\u003cdiv id="x">t\u003c/div>', 'margin-top'],
  ['an-invented-unit-is-dropped', '#x { width:40zz; height:33px; }', '\u003cdiv id="x">t\u003c/div>', 'height'],
  ['a-bare-number-is-dropped', '#x { width:100; height:21px; }', '\u003cdiv id="x">t\u003c/div>', 'height'],
  ['padding-in-pt', '#x { padding:12pt; }', '\u003cdiv id="x">t\u003c/div>', 'padding-left'],
  ['margin-in-rem', '#x { margin:1rem; }', '\u003cdiv id="x">t\u003c/div>', 'margin-top'],
  ['font-size-in-pt', '#x { font-size:12pt; }', '\u003cdiv id="x">t\u003c/div>', 'font-size'],
  ['line-height-in-em', '#x { font-size:20px; line-height:1.5em; }', '\u003cdiv id="x">t\u003c/div>', 'line-height'],
  ['line-height-bare-is-a-multiplier', '#x { font-size:20px; line-height:1.5; }', '\u003cdiv id="x">t\u003c/div>', 'line-height'],
];

const host = document.getElementById('cases');
const out = [];
for (const [name, css, html, props] of CASES) {
  const box = document.createElement('div');
  box.className = 'case';
  box.dataset.page = name;
  if (css) {
    /* Scoped, so every case's stylesheet can share one page. */
    const st = document.createElement('style');
    st.textContent = css.replace(/(^|\})\s*([^{}]+)\{/g,
      (m, brace, sel) => brace + sel.split(',')
        .map(s => '[data-page="' + name + '"] ' + s.trim()).join(',') + '{');
    box.appendChild(st);
  }
  box.insertAdjacentHTML('beforeend', html);
  host.appendChild(box);
}

for (const [name, css, html, props] of CASES) {
  const box = host.querySelector('[data-page="' + name + '"]');
  const el = box.querySelector('#x');
  out.push('# case ' + name);
  for (const prop of props.split(/\s+/).filter(Boolean)) {
    out.push(prop + ' ' +
      (el ? getComputedStyle(el).getPropertyValue(prop) : '?'));
  }
}

const t = document.getElementById('out');
t.value = out.join('\n');
t.textContent = out.join('\n');
</script>
