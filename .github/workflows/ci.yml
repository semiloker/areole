name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The C89 claim is the whole premise of the library, so it is machine checked
  # rather than asserted in the README. This job also enforces the split that
  # makes the claim possible: <windows.h> does not compile with extensions
  # disabled, so only platform/ may include it, and platform/ is not built here.
  strict-c89:
    name: strict C89 (core only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reject platform headers in the core
        run: |
          if grep -rnE '#[[:space:]]*include[[:space:]]*[<"](windows|X11/|Cocoa/)' src/ include/; then
            echo "::error::core sources must stay platform agnostic"
            exit 1
          fi
          echo "core is platform agnostic"

      - name: Reject C99 constructs in the core
        run: |
          if grep -rnE '(^|[^:"])//|#[[:space:]]*include[[:space:]]*<(stdint|stdbool|inttypes)\.h>' \
                 src/ include/; then
            echo "::error::// comments and C99 headers are not allowed in the core"
            exit 1
          fi
          echo "no C99 constructs"

      - name: Compile with gcc and clang
        run: |
          mkdir -p /tmp/objs
          for cc in gcc clang; do
            for f in src/*.c; do
              echo "$cc $f"
              "$cc" -std=c89 -pedantic-errors -Wall -Wextra -Werror \
                    -Wshadow -Wcast-qual -Wstrict-prototypes -Wmissing-prototypes \
                    -Wwrite-strings -Wold-style-definition \
                    -Iinclude -c "$f" -o "/tmp/objs/$cc-$(basename "$f").o"
              # And again with the counters compiled in. Both builds ship, so
              # both have to hold the standard.
              "$cc" -std=c89 -pedantic-errors -Wall -Wextra -Werror -DAR_INSTRUMENT \
                    -Iinclude -c "$f" -o "/tmp/objs/$cc-inst-$(basename "$f").o"
            done
          done

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ubuntu / gcc",   os: ubuntu-latest,  cc: gcc,   generator: "Unix Makefiles" }
          - { name: "ubuntu / clang", os: ubuntu-latest,  cc: clang, generator: "Unix Makefiles" }
          - { name: "windows / msvc", os: windows-latest, cc: "",    generator: "" }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.generator }}" ]; then
            CC=${{ matrix.cc }} cmake -S . -B build -G "${{ matrix.generator }}" \
              -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build
          fi

      - name: Build
        run: cmake --build build --config Release

      # The suite. It had never run here: every release was gated on the greps,
      # the compile, clang-format, cppcheck and the examples' own --selftest,
      # and the twelve hundred checks in ar_test were run by hand by whoever
      # remembered. A gate that is green because nobody pulled the lever is the
      # same failure as a baseline that never checked it covered the scenes.
      #
      # ctest also carries ar_bench_selftest and the short fuzz run.
      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  build-mingw:
    name: windows / mingw-w64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Every page of the tour, declared against a real surface with no window.
      # A page that leaves the tree unbalanced or overruns the box budget fails
      # here rather than when somebody clicks on it.
      - name: Tour self-check
        run: ./build/example_tour.exe --selftest

      # The showcase asserts what its page claims rather than that it drew
      # something: that border-box and content-box really differ by the
      # padding, that fit-content really lands between the other two, and that
      # the highest z-index really is the pixel on top.
      - name: Showcase self-check
        run: ./build/example_showcase.exe --selftest

      # The margin-collapsing corpus. It only prints rectangles here; the
      # browser comparison needs Chromium and runs locally.
      - name: Block corpus renders
        run: ./build/example_block.exe --dump > /dev/null

      # The flex, grid and subgrid corpus. Like the block one it only renders
      # here; the browser half needs Chromium and runs locally. It is gated at
      # all because a corpus that stops building is a corpus nobody runs.
      - name: Grid corpus renders
        run: ./build/example_grid.exe --dump > /dev/null

      # And its twin is generated, so it cannot drift from the C side unless
      # somebody forgets to regenerate. This says so.
      - name: The grid twin is up to date
        run: |
          ./build/example_grid.exe --html > /tmp/grid.html
          diff -u examples/11_grid/grid.html /tmp/grid.html

      # 0.9.0's demonstration: a document read from HTML, styled, laid out and
      # painted, with nothing declared by hand. It asserts what it claims --
      # the document parsed whole, the boxes carry text, the block layout
      # actually ran, and two identical frames are identical -- rather than
      # that it drew something.
      - name: Document self-check
        run: ./build/example_document.exe --selftest

      # The sample document is a file as well as a string, so it can be opened
      # in a browser beside the window the example draws -- which is the only
      # way to look at "it reads HTML" and see whether it is true. Generated
      # from the same bytes the self-check parses, so the two cannot drift.
      - name: The document twin is up to date
        run: |
          ./build/example_document.exe --html > /tmp/document.html
          diff -u examples/13_document/document.html /tmp/document.html

      # And it parses back from disk, which is the path a real caller takes.
      - name: The document parses from a file
        run: ./build/example_document.exe examples/13_document/document.html --selftest

      # Example 14: the same four calls, but an interface rather than a
      # document -- a grid shell, a subgrid card deck, a table and a badge.
      # Its first check is that the stylesheet parsed with no rule refused,
      # because a rule areole cannot take is dropped whole and silently and
      # the page still lays out, just wrongly.
      - name: Interface self-check
        run: ./build/example_interface.exe --selftest

      - name: The interface twin is up to date
        run: |
          ./build/example_interface.exe --html > /tmp/page.html
          diff -u examples/14_interface/page.html /tmp/page.html

      - name: The interface parses from a file
        run: ./build/example_interface.exe examples/14_interface/page.html --selftest

      # Ten documents saved from the web, which is 0.9.0 acceptance criterion
      # 9. Not a pixel gate -- the criterion is assessed by eye and says so.
      # What this catches is the thing an eye cannot be asked about on every
      # commit: a parse or a layout that crashes, hangs, or silently truncates
      # on markup nobody wrote for this engine. `--selftest` fails if any of
      # the ten overflows its budget or produces no boxes.
      - name: The real-document corpus
        run: ./build/example_real.exe --selftest

      # The HTML tree corpus. Unlike the layout corpora this one needs no
      # window at all -- its output is a tree per case -- so the dump runs
      # here and only the browser half is local.
      - name: HTML tree corpus dumps
        run: ./build/example_html.exe --dump > /dev/null

      - name: The HTML twin is up to date
        run: |
          ./build/example_html.exe --html > /tmp/cases.html
          diff -u examples/12_html/cases.html /tmp/cases.html

      # 0.9.1 acceptance criterion 2: what HTML's legacy attributes compute to.
      # The browser half of it needs a browser and runs locally, the way every
      # other corpus comparison does. What runs here is the half that can: the
      # dump has to be produced without crashing, and the twin has to still be
      # the twin -- a generated file that drifts is a corpus reporting
      # agreement about cases that are no longer the same cases.
      - name: Presentational hint dumps
        run: ./build/ar_hints.exe > /dev/null

      - name: The hint twin is up to date
        run: |
          ./build/ar_hints.exe --html > /tmp/hints.html
          diff -u tests/hints.html /tmp/hints.html

      # 0.9.1 acceptance criterion 1: every element's defaults. Same split as
      # the hints corpus -- the browser half runs locally, the dump and the
      # twin's freshness run here. The twin is generated from the selectors in
      # src/ar_ua_css.c, so an element added to the sheet and not to the corpus
      # fails this step rather than going unchecked.
      - name: User-agent stylesheet dumps
        run: ./build/ar_elements.exe > /dev/null

      - name: The element corpus is generated from the sheet
        run: |
          python tools/gen_element_corpus.py
          git diff --exit-code tests/ar_elements.c

      - name: The element twin is up to date
        run: |
          ./build/ar_elements.exe --html > /tmp/elements.html
          diff -u tests/elements.html /tmp/elements.html

      # 0.9.1 acceptance criterion 3: what a document with no doctype does
      # differently. Its twin has no doctype either -- that is what puts it in
      # quirks mode -- and the twin reports document.compatMode so a page that
      # quietly slipped into standards fails loudly rather than agreeing about
      # the wrong thing.
      - name: Quirks-mode dumps
        run: ./build/ar_quirks.exe > /dev/null

      - name: The quirks twin is up to date
        run: |
          ./build/ar_quirks.exe --html > /tmp/quirks.html
          diff -u tests/quirks.html /tmp/quirks.html

      # 0.4.1 acceptance criterion 2: what every CSS length unit computes to.
      # The comparison against a browser needs one and runs locally; what runs
      # here is that the corpus still answers every case, and that its twin
      # still mirrors the C source -- every hand-written twin in this tree has
      # drifted, and a generated one that nothing diffs drifts just as well.
      - name: Unit dumps
        run: ./build/ar_units.exe > /dev/null

      - name: The units twin is up to date
        run: |
          ./build/ar_units.exe --html > /tmp/units.html
          diff -u tests/units.html /tmp/units.html

      # 0.9.1 acceptance criterion 4: the gallery harness, end to end. The
      # browser half needs a browser and runs locally like every other
      # comparison; what runs here is the half that can, which is that every
      # demo still renders and still draws exactly what was blessed. A change
      # to any pixel of any demo fails this step until somebody blesses it on
      # purpose.
      - name: Every gallery demo renders
        run: |
          for f in $(find examples/gallery -name '*.html'); do
            ./build/ar_gallery.exe "$f" --geometry > /dev/null || exit 1
          done

      - name: The gallery draws what was blessed
        run: python tools/gallery.py run --all --golden-only --gate

      # 0.9.1 acceptance criterion 5: every catalogue row marked shipped has a
      # demo. The demo id is a column in the matrix and the path of the file,
      # which is what lets the two be compared -- and the note at the top of
      # support-matrix-css.md is the record of what happens when they are not:
      # six releases of rows that had gone stale in both directions.
      #
      # Only shipped rows are required. A partial row names its limitation and
      # a planned row is not built, and requiring demos for those would make
      # this red for the two states the catalogue uses to be honest.
      - name: Every shipped catalogue row has a demo
        run: python tools/check_gallery.py --check

      # 0.9.0 acceptance criterion 3: the full named character reference table
      # round-trips against the specification's own JSON. It regenerates
      # src/ar_html_entity.c from the vendored tools/entities.json and compares,
      # so a hand edit to either fails here.
      #
      # Offline on purpose. entities.json is vendored, so this needs no network
      # and cannot change underneath a release because a URL did.
      - name: The entity table round-trips
        run: python tools/gen_entities.py --check

      # 0.4.2: both corpora are generated, so a hand edit to either fails here.
      #
      # The @supports one is generated from AR_PROPS -- the table the
      # declaration parser looks a property up in -- because a property added
      # to the parser and forgotten in the corpus is one @supports could start
      # lying about with nothing to notice.
      - name: The @supports corpus covers every property
        run: python tools/gen_supports_corpus.py --check

      - name: The media query corpus is not hand-edited
        run: python tools/gen_media_corpus.py --check

      # 0.9.0 acceptance criterion 1: the html5lib tokenizer suite at 100%.
      # Not 98, not "almost" -- the tokenizer is finite and fully specified.
      # ar_html5lib exits non-zero if either suite is under its gate.
      - name: html5lib tokenizer suite
        run: ./build/ar_html5lib.exe --tokenizer --quiet

      # 0.9.0 acceptance criterion 2: the html5lib tree construction suite at
      # 98%. Met -- 1,884 of 1,922, with the 8 scripting cases skipped and
      # counted, never quietly passed -- so this is a gate rather than a
      # report. It spent the whole release as `|| true` with a comment saying
      # it would become real the day the number arrived; this is that day.
      #
      # ar_html5lib exits non-zero under the gate, so no `|| true`.
      - name: html5lib tree construction
        run: ./build/ar_html5lib.exe --tree --quiet

      # The HTML subsystem's binary budget, measured rather than typed. The
      # figures in the release document were hand-transcribed and were 12 KB
      # wrong by the time anyone looked -- the same failure as a benchmark
      # baseline that never checked it covered its scenes. A budget nothing
      # measures is a wish.
      - name: The HTML parser fits its budget
        run: python tools/check_size.py --check

  tidy:
    name: format and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          # Pinned. clang-format reflows differently between major versions, and
          # a gate that disagrees with the contributor's local copy is a gate
          # that gets disabled.
          pip install clang-format==22.1.8

      - name: clang-format
        run: |
          set -e
          dirs=""
          for d in include src platform examples tests bench tools; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          find $dirs \( -name '*.c' -o -name '*.h' \) -print0 |
            xargs -0 -r clang-format --dry-run --Werror

      # `style` is deliberately not enabled, and the reason is not squeamishness.
      # It found one defect and thirty-eight non-findings, and one of its checks
      # cannot ever pass here: "the scope of the variable can be reduced" is a
      # restatement of C89 wanting declarations at the top of a block, which is
      # invariant 3. A gate that cannot go green is a gate nobody reads, and
      # this one had been red since it was written -- which is how a null
      # dereference in ar_break_next survived inside it.
      #
      # warning, performance and portability all stay. That null dereference was
      # a `warning`, so the category that mattered is the one kept.
      - name: cppcheck
        run: |
          cppcheck --quiet --error-exitcode=1 --std=c89 --inline-suppr \
                   --enable=warning,performance,portability \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=checkersReport \
                   -Iinclude src
