name: bench

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The tool checking itself. Fast, deterministic, and it runs before anything
  # else because a benchmark that lies is worse than no benchmark.
  selftest:
    name: harness selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ar_bench_selftest
      - name: Run
        run: ./build/ar_bench_selftest

  # The comparison harness must build and run. Clay and microui are pure layout
  # and need no window, so they run here; GDI needs Windows and is compiled in
  # only there.
  #
  # No timing assertion. A shared runner cannot support one, and the point of
  # this job is that a vendored rival cannot silently stop compiling -- which is
  # a real risk, since both rivals are built with relaxed flags.
  compare:
    name: comparison harness builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ar_compare
      - name: Run the portable engines
        run: |
          ./build/ar_compare --engine clay --iters 20 --repeat 1 --warmup 5
          ./build/ar_compare --engine microui --iters 20 --repeat 1 --warmup 5
      - name: The JSON must parse
        run: |
          ./build/ar_compare --all --iters 20 --repeat 1 --warmup 5 --json > /tmp/cmp.json
          python -c "import json,sys; json.load(open('/tmp/cmp.json'))"

  # The generated document must match the committed baseline. This is what
  # stops a published number from drifting away from a measured one.
  document:
    name: PERFORMANCE.md is generated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/gen_perf_doc.py --check

  # The scene library must run to completion, every scene must report zero
  # allocations after init, and no scene may overflow its budget.
  #
  # Deliberately NOT a timing gate. A shared GitHub runner has variance far
  # worse than the reference laptop, which itself measures a 15% median spread
  # between epochs, and gating on timings there would produce failures nobody
  # can act on. The timing gate belongs on a dedicated quiet machine; until one
  # exists, CI checks the invariants and the numbers are published rather than
  # enforced.
  invariants:
    name: benchmark invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ar_bench

      - name: Run every scene
        run: ./build/ar_bench --all --iters 40 --repeat 1 --warmup 10 --json > run.json

      - name: Check the invariants
        run: |
          python - <<'PY'
          import json, sys

          d = json.load(open("run.json"))
          scenes = d["scenes"]
          bad = []

          if not d["instrumented"]:
              bad.append("the benchmark was built without counters")

          for s in scenes:
              if s["allocations_after_init"]:
                  bad.append("%s allocated after init" % s["name"])
              if s["overflowed"]:
                  bad.append("%s overflowed its box budget" % s["name"])
              if s["stylesheet_errors"]:
                  bad.append("%s had %d stylesheet error(s)"
                             % (s["name"], s["stylesheet_errors"]))

          print("%d scenes ran" % len(scenes))
          print("allocations after init: %d"
                % sum(s["allocations_after_init"] for s in scenes))

          if bad:
              for b in bad:
                  print("FAIL: %s" % b)
              sys.exit(1)
          print("every invariant holds")
          PY

  # A gate that adapts to the machine it is on. Reported on every pull request
  # so a regression is visible, and only enforced once a runner exists that can
  # support it -- which the tool itself decides rather than an assumption.
  regression:
    name: regression report (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target ar_bench
      - name: Compare against the committed baseline
        run: |
          ./build/ar_bench --all --iters 150 --repeat 3 --warmup 30 \
            --compare bench/baseline.json || true
        # No --gate. The baseline was taken on the reference laptop and this is
        # a shared runner; a pass or fail here would be measuring the runner.
        # The table is the point, and a human reads it.
